[project]
name = "e-mandi-backend"
version = "0.1.0"
description = "E-MANDI 2.0 agricultural marketplace backend (FastAPI modular monolith)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "gunicorn>=22.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "python-multipart>=0.0.9",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pgvector>=0.3",
  "redis>=5.0",
  "arq>=0.26",
  "pyjwt[crypto]>=2.8",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
  "tenacity>=8.3",
  "orjson>=3.10",
  "structlog>=24.1",
  "boto3>=1.34",
  "pillow>=10.3",
  "pypdf>=5.0",
  "google-auth>=2.29",
  "google-genai",
  "openai>=1.35",
  "langgraph>=0.2",
  "langgraph-checkpoint-postgres",
  "psycopg[binary,pool]>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "fakeredis>=2.23",
  "freezegun>=1.5",
  "ruff>=0.5",
  "mypy>=1.10",
  "boto3-stubs[s3]",
  "moto[s3]>=5.0",
  "cfn-lint>=1.0",
  "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 150   # the code base is written to ~140 columns; 100 would flag 2,400 lines for no safety benefit
target-version = "py311"
src = ["app", "tests", "scripts"]
extend-exclude = ["alembic/versions"]   # applied migrations are never edited

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]
ignore = [
  "S101",    # assert is fine (tests, invariants)
  "E501",    # long literals (voice templates, SQL, messages) are intentional; line-length only guides formatting
  "SIM108",  # nested ternaries hurt readability
  "E741",    # `l` for a Listing is the project's short name for it
  "RUF059",  # unused tuple-unpacking targets are used for readability
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends", "fastapi.Header", "fastapi.Body", "fastapi.Path", "fastapi.File", "fastapi.Form"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"app/schemas/**" = ["RUF012"]  # pydantic models: mutable defaults are copied per instance
"tests/**" = ["E501", "S105", "S106", "S311", "S603", "S607", "S608"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
# Baseline (CI-enforced). Tightening to `strict = true` is tracked in docs/QUALITY.md (annotation-only backlog).

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: needs Postgres and Redis"]

[tool.coverage.run]
source = ["app"]

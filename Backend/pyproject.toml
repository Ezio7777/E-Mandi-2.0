[project]
name = "e-mandi-backend"
version = "0.1.0"
description = "E-MANDI 2.0 agricultural marketplace backend (FastAPI modular monolith)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "gunicorn>=22.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "python-multipart>=0.0.9",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pgvector>=0.3",
  "redis>=5.0",
  "arq>=0.26",
  "pyjwt[crypto]>=2.8",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
  "tenacity>=8.3",
  "orjson>=3.10",
  "structlog>=24.1",
  "boto3>=1.34",
  "pillow>=10.3",
  "google-auth>=2.29",
  "google-genai",
  "openai>=1.35",
  "langgraph>=0.2",
  "langgraph-checkpoint-postgres",
  "psycopg[binary,pool]>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "fakeredis>=2.23",
  "freezegun>=1.5",
  "ruff>=0.5",
  "mypy>=1.10",
  "boto3-stubs[s3]",
  "moto[s3]>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: needs Postgres and Redis"]

[tool.coverage.run]
source = ["app"]

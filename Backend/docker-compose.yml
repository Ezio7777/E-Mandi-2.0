# Local / single-host stack. Production adds docker-compose.prod.yml (Caddy HTTPS, no published DB/Redis ports).
#   cp .env.example .env   # then edit secrets
#   docker compose up -d --build
name: e-mandi

x-app: &app
  build: .
  image: e-mandi-backend:latest
  env_file: .env
  environment: &app-env
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-emandi}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-emandi}
    REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
  restart: unless-stopped
  networks: [backend]

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emandi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-emandi}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD:-x} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [backend]

  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"
    depends_on:
      db: {condition: service_healthy}

  api:
    <<: *app
    command: ["api"]
    environment:
      <<: *app-env
      FORWARDED_ALLOW_IPS: "*"   # only the reverse proxy / host can reach this container
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  worker:
    <<: *app
    command: ["worker"]
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,redis,time,sys; r=redis.Redis.from_url(os.environ['REDIS_URL']); v=r.get('worker:heartbeat'); sys.exit(0 if v and time.time()-float(v)<120 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

networks:
  backend:

volumes:
  pgdata:
  redisdata:
